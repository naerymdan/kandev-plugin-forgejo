# Kandev plugin manifest — the declarative contract between this plugin and a
# Kandev host. `id` matches the Go module name, the id passed to
# window.registerKandevPlugin(...) in ui/bundle.js, and the plugin-registry
# catalog entry. Keep all four in sync when renaming.
id: "kandev-plugin-forgejo"
api_version: 1
version: "0.2.0"
display_name: "Forgejo"
description: "Connect a self-hosted Forgejo or Gitea instance to native Kandev repository, pull-request, task-link, and review workflows."
author: "naerymdan"
categories: ["connector"]
repo_url: "https://github.com/naerymdan/kandev-plugin-forgejo"
icon: "assets/icon.svg"

# The source-control contracts this plugin started on shipped in v0.88.0, but
# `agent_tools` below needs a host that serves plugin tools over Kandev's MCP
# endpoint. An older host ignores the block silently rather than refusing the
# install, which would leave the tools missing with nothing said — so the floor
# is raised instead.
min_kandev_version: "0.95.0"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# Least privilege: `tasks`/`repositories` back the attached-repository resolver
# used by verified PR creation; `state` backs the task<->pull-request
# association store. No api_write — Kandev owns every entity mutation here.
capabilities:
  api_read: ["tasks", "repositories"]
  state: true
  secrets: true

# Browser bodies are untrusted and bounded. Kandev authorizes each selector and
# passes it separately as VerifiedActionContext.
actions:
  - key: "connection.get"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "connection.test"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "connection.set_enabled"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "repositories.list"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "repositories.inspect"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "repositories.branches"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "change_requests.create"
    scope: "task"
    max_body_bytes: 65536
  - key: "change_requests.get"
    scope: "task"
    max_body_bytes: 1024
  - key: "change_requests.link"
    scope: "task"
    max_body_bytes: 16384
  - key: "change_requests.unlink"
    scope: "task"
    max_body_bytes: 4096
  - key: "change_requests.associations"
    scope: "workspace"
    max_body_bytes: 1024

# Tools exposed to task agents through Kandev's MCP endpoint. Every definition
# here is injected into every agent session on a matching surface and cannot be
# swapped for a built-in, so the set is deliberately small and the descriptions
# and schemas are written to be read once, not browsed. They exist to delete
# hand-written curl recipes from workflow step prompts, which is only a win if
# they cost less than the prose they replace.
agent_tools:
  - name: "ci"
    description: "Forgejo/Gitea CI for a ref in this task's repo: overall state, plus each job with an id for ci_log."
    surfaces: ["kanban-task"]
    input_schema:
      type: object
      properties:
        ref:
          type: string
          description: "Branch name or commit SHA."
        repo:
          type: string
          description: "owner/name; only if the task has several."
      required: ["ref"]
    annotations:
      read_only_hint: true
      idempotent_hint: true
      open_world_hint: true

  - name: "ci_log"
    description: "Tail of a Forgejo/Gitea CI job log, by the job id ci reports."
    surfaces: ["kanban-task"]
    input_schema:
      type: object
      properties:
        job:
          type: integer
          description: "Job id from ci."
        lines:
          type: integer
          description: "Tail length. Default 200, max 2000."
        repo:
          type: string
      required: ["job"]
    annotations:
      read_only_hint: true
      idempotent_hint: true
      open_world_hint: true

  - name: "pr"
    description: "This task's Forgejo/Gitea pull request: get, open, or ready (clears the WIP: prefix). open is idempotent."
    surfaces: ["kanban-task"]
    input_schema:
      type: object
      properties:
        op:
          type: string
          enum: ["get", "open", "ready"]
        head:
          type: string
          description: "Branch with the changes; required for open."
        base:
          type: string
          description: "Target branch; defaults to the repo default."
        title:
          type: string
          description: "Required for open."
        body:
          type: string
        draft:
          type: boolean
        repo:
          type: string
      required: ["op"]
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true

repository_providers: ["forgejo"]

reference_sources:
  - source: "forgejo_pull_requests"
    provider: "forgejo"
    kind: "pull_request"
    display_name: "Forgejo pull requests"
    kind_label: "Pull request"
    order: 40

ui:
  bundle: "/ui/bundle.js"
  styles: ["/ui/plugin.css"]

config_schema:
  type: object
  required: ["base_url", "api_token"]
  properties:
    base_url:
      type: string
      title: "Instance URL"
      description: "Base URL of the Forgejo or Gitea instance, e.g. https://codeberg.org. The REST v1 API is expected at <base_url>/api/v1."
    api_token:
      type: string
      title: "Access token"
      description: "Personal access token with scopes read:repository, read:user and read:issue, plus write:repository to open pull requests. Stored in Kandev's encrypted vault and readable only inside this plugin process."
      secret: true
